<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Audiobook Player</title>

        <style>
            /* =========================
            THEME
            ========================= */

            :root {
                --bg: #1e1b18;
                --panel: #2a2521;
                --panel-2: #322c27;
                --text: #f2e9e4;
                --muted: #c9b8a8;
                --accent: #d4a373;
                --border: #3a332d;
                --shadow: rgba(0,0,0,0.35);
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
                background: var(--bg);
                color: var(--text);
            }

            /* =========================
            LAYOUT (PLAYER ABOVE LIST)
            ========================= */

            .container {
                display: flex;
                flex-direction: column;
                height: 100vh;
            }

            /* =========================
            PLAYER
            ========================= */

            .player {
                background: linear-gradient(180deg, var(--panel), #221e1b);
                border-bottom: 1px solid var(--border);
                padding: 14px;
                box-shadow: 0 4px 12px var(--shadow);
            }

            .now-playing {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 10px;
            }

            .cover {
                width: 52px;
                height: 52px;
                border-radius: 10px;
                background: linear-gradient(135deg, #3b2f2a, #1f1a17);
                border: 1px solid var(--border);
            }

            .track-info h2 {
                margin: 0;
                font-size: 15px;
            }

            .track-info p {
                margin: 2px 0 0;
                font-size: 12px;
                color: var(--muted);
            }

            audio {
                width: 100%;
                accent-color: var(--accent);
            }

            /* =========================
            PLAYLIST
            ========================= */

            #playlist {
                flex: 1;
                overflow-y: auto;
                padding: 10px;
            }

            /* =========================
            FOLDERS
            ========================= */

            .playlist-folder {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 12px;
                margin-bottom: 10px;
                overflow: hidden;
            }

            .playlist-folder-header {
                padding: 12px;
                background: var(--panel-2);
                font-weight: 600;
                font-size: 14px;
                cursor: pointer;
                user-select: none;
            }

            .playlist-folder-header:hover {
                background: #3a332d;
            }

            /* collapse */
            .playlist-folder.collapsed .playlist-folder-content {
                display: none;
            }

            .playlist-folder.collapsed .playlist-folder-header::after {
                content: "▸";
                float: right;
                color: var(--muted);
            }

            .playlist-folder:not(.collapsed) .playlist-folder-header::after {
                content: "▾";
                float: right;
                color: var(--accent);
            }

            /* =========================
            ITEM BASE
            ========================= */

            .playlist-folder-content {
                padding: 6px;
            }

            .playlist-item {
                display: flex;
                align-items: center;
                gap: 12px;

                padding: 10px;
                border-radius: 10px;
                cursor: pointer;
                transition: background 0.15s ease, transform 0.08s ease;
            }

            .playlist-item:hover {
                background: #3a322c;
            }

            .playlist-item:active {
                transform: scale(0.99);
            }

            /* ACTIVE */
            .playlist-item.active {
                background: rgba(212, 163, 115, 0.14);
                border: 1px solid rgba(212, 163, 115, 0.35);
            }

            /* =========================
            LEFT (number + status side by side)
            ========================= */

            .playlist-item-left-section {
                display: flex;
                align-items: center;
                gap: 6px;
                min-width: 60px;
            }

            .playlist-item-number {
                margin: 0;
                font-size: 12px;
                color: var(--muted);
            }

            .playlist-item-status {
                font-size: 10px;
                color: var(--accent);
            }

            /* =========================
            CENTER (flexible + truncation)
            ========================= */

            .playlist-item-center-section {
                flex: 1;
                min-width: 0; /* IMPORTANT for ellipsis */
                display: flex;
                flex-direction: column;
                gap: 2px;
            }

            .playlist-item-title {
                margin: 0;
                font-size: 14px;
                color: var(--text);

                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .playlist-item-author {
                margin: 0;
                font-size: 12px;
                color: var(--muted);

                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            /* =========================
            RIGHT (vertical info)
            ========================= */

            .playlist-item-right-section {
                display: flex;
                flex-direction: column;
                gap: 2px;
                text-align: right;
                min-width: 70px;
            }

            .playlist-item-length,
            .playlist-item-size {
                margin: 0;
                font-size: 11px;
                color: var(--muted);
            }

            /* =========================
            FOOTER
            ========================= */

            footer {
                text-align: center;
                padding: 10px;
                font-size: 12px;
                color: var(--muted);
                border-top: 1px solid var(--border);
                background: #1a1715;
            }
        </style>

    </head>
    <body>
        <div class="container">
            <!-- AUDIO PLAYER -->
            <section class="player">

                <div class="now-playing">
                    <div class="cover"></div>

                    <div class="track-info">
                        <h2>N/A</h2>
                        <p>N/A</p>
                    </div>
                </div>

                <audio controls></audio>
            </section>

            <!-- PLAYLIST -->
            <section id="playlist">

            </section>

        </div>

        <!-- FOOTER -->
        <footer>
            Audiobook Player © 2026 • Your personal listening space
        </footer>
        <script src="db/dataset.js"></script>
        <script>
            /**
             * Event listener that triggers when the initial HTML document has been completely 
             * loaded and parsed. It serves as the entry point for the application.
             */
            window.addEventListener("DOMContentLoaded", initApp);

            /**
             * Initializes the application state and triggers the UI generation.
             * * @function initApp
             * @description This function logs the boot sequence and passes the core 
             * playlist data to the rendering engine.
             * @returns {void}
             */
            function initApp() {
                // Log startup for debugging purposes
                console.log("App starting!!!");

                /**
                 * @todo Ensure playlistData is globally accessible or 
                 * fetched from an external API before this call.
                 */

            }


            /**
             * Orchestrates the generation of the entire audiobook playlist.
             * It clears the current playlist container and populates it with folders
             * based on the provided data structure.
             *
             * @param {Object} playlistData - The main data object containing an array of folders.
             */
            function generatePlaylist(playlistData) {
                console.log("GENERATE PLAYLIST: Start generating playlist.");

                // 1. Locate the main container element in the DOM
                const playlist = document.getElementById("playlist");

                // 2. Safety Check: If the element doesn't exist, stop execution to prevent errors
                if (!playlist) {
                    console.error("GENERATE PLAYLIST: Cannot get playlist by id!!!");
                    return;
                }

                // 3. Clear existing content to ensure a fresh render (prevents duplication)
                playlist.innerHTML = "";

                // 4. Iterate through the folder data provided in playlistData
                playlistData.folders.forEach(folder => {
                    // Create a folder component (set to 'false' so they start expanded by default)
                    const playlistFolder = generatePlaylistFolder(folder, false);

                    // 5. Inject the fully built folder into the main playlist container
                    playlist.appendChild(playlistFolder);
                });

                console.log("GENERATE PLAYLIST: Playlist generated.");
            }


            /**
             * Generates a folder component for the playlist that groups multiple audiobook tracks.
             * It creates a header for the folder and populates the content area by looping through
             * the provided file list and calling `generatePlaylistItem`.
             *
             * @param {Object} folder_itemsList - The data object containing the folder name and file array.
             * @param {boolean} isCollapsed - Determines if the folder should start in a closed state.
             * @returns {HTMLDivElement} The complete folder element with all nested playlist items.
             */
            function generatePlaylistFolder(folder_itemsList, isCollapsed) {
                // 1. Extract the author/folder name or default to "Unknown"
                const author = folder_itemsList.display_name || "Unknown";
                console.log("GENERATE PLAYLIST FOLDER: generating folder: " + author + ".");

                // 2. Create the main structural elements for the folder
                const playlistFolder = document.createElement("div");
                const playlistFolderHeader = document.createElement("div");
                const playlistFolderContent = document.createElement("div");

                // 3. Set up the header text and apply CSS classes for styling
                playlistFolderHeader.textContent = author;
                playlistFolder.classList.add("playlist-folder");
                playlistFolderHeader.classList.add("playlist-folder-header");
                playlistFolderContent.classList.add("playlist-folder-content");

                // 4. Handle the initial visibility state (collapsed vs expanded)
                if (isCollapsed) {
                    playlistFolder.classList.add("collapsed");
                }

                // 5. Initialize counters and placeholders for the loop
                let itemNumber = 0; 

                // 6. Iterate through the files to create and append individual items
                folder_itemsList.files.forEach(item => {
                    itemNumber++;

                    // Fetch the play status from local storage for each specific file
                    const status = getPlaylistItemStatusFromLocalStorage(item.filePath);

                    // Generate the actual row element using your master assembly function
                    const playlistItem = generatePlaylistItem(
                                                itemNumber, 
                                                status, 
                                                item.title, 
                                                item.artist, 
                                                item.length, 
                                                item.size_kb
                                            );

                    // Add the finished item into the folder's content area
                    playlistFolderContent.appendChild(playlistItem);
                });

                // 7. Assemble the folder: Add the header and the populated content area
                playlistFolder.appendChild(playlistFolderHeader);
                playlistFolder.appendChild(playlistFolderContent);

                // 8. Return the fully constructed folder
                return playlistFolder;
            }


            /**
             * Retrieves the current status of an audiobook (e.g., "Played", "New", or a specific icon)
             * from the browser's local storage based on its file path.
             *
             * NOTE: This is currently a placeholder and will be fully implemented 
             * once the data persistence logic is finalized.
             *
             * @param {string} filePath - The unique path or ID of the audiobook file.
             * @returns {string} The status string or icon character retrieved from storage.
             */
            function getPlaylistItemStatusFromLocalStorage(filePath) {
                // 1. TODO: Implement logic to search localStorage using filePath as the key
                // Example: const savedStatus = localStorage.getItem(filePath);

                // 2. Currently returning a hardcoded "OK" as a placeholder for testing the UI
                const status = "ОК"; 

                // 3. Return the status value to the caller (likely generatePlaylistItem)
                return status;
            }


            /**
            * Assembles the final audiobook playlist item by combining the three main sections.
            * This function acts as the primary builder, utilizing the Left, Center, and 
            * Right section functions to create a structured and complete UI component.
            *
            * @param {number|string} number - The track number.
            * @param {string} status - The status icon/data.
            * @param {string} title - The audiobook title.
            * @param {string} author - The author's name.
            * @param {string} length - The duration of the audio.
            * @param {string} size - The file size of the audio.
            * @returns {HTMLDivElement} The fully assembled playlist item row.
            */
            function generatePlaylistItem(number, status, title, author, length, size) {
                // 1. Create the main container for the entire playlist row
                const playlistItem = document.createElement("div");
                playlistItem.classList.add("playlist-item");

                // 2. Build the three major sections using their respective helper functions
                const leftSelection = generatePlaylistItemLeftSection(number, status);
                const centerSelection = generatePlaylistItemCenterSection(title, author);
                const rightSelection = generatePlaylistItemRightSection(length, size);

                // 3. Append the sections in order: Left (Start), Center (Middle), Right (End)
                playlistItem.appendChild(leftSelection);
                playlistItem.appendChild(centerSelection);
                playlistItem.appendChild(rightSelection);

                // 4. Return the finished component, ready to be added to the list on the page
                return playlistItem;
            }


            /**
            * Creates a container div that groups the leading metadata of a playlist item.
            * This function utilizes `generatePlaylistItemNumber` and `generatePlaylistItemStatus`
            * to display the track position and current status (icon) at the start of the row.
            *
            * @param {number|string} number - The index or track number.
            * @param {string} status - The status icon or data to be displayed.
            * @returns {HTMLDivElement} The container div holding the number and status elements.
            */
            function generatePlaylistItemLeftSection(number, status) {
                // 1. Create the wrapper div for the left-side layout components
                const leftSection = document.createElement("div");
                leftSection.classList.add("playlist-item-left-section");

                // 2. Generate the track number and status icon using the specific sub-functions
                const itemNumber = generatePlaylistItemNumber(number);
                const itemStatus = generatePlaylistItemStatus(status);

                // 3. Append the number and status elements to this left container
                leftSection.appendChild(itemNumber);
                leftSection.appendChild(itemStatus);

                // 4. Return the assembled section for the final playlist row construction
                return leftSection;
            }


            /**
            * Creates a container div that groups the primary text information of a playlist item.
            * This function utilizes `generatePlaylistItemTitle` and `generatePlaylistItemAuthor`
            * to display the book's title and its creator in a central block.
            *
            * @param {string} title - The title of the audiobook.
            * @param {string} author - The name of the author.
            * @returns {HTMLDivElement} The container div holding title and author elements.
            */
            function generatePlaylistItemCenterSection(title, author) {
                // 1. Create the wrapper div for the central text content
                const centerSection = document.createElement("div");
                centerSection.classList.add("playlist-item-center-section");

                // 2. Generate the title and author elements using your specific sub-functions
                const itemTitle = generatePlaylistItemTitle(title);
                const itemAuthor = generatePlaylistItemAuthor(author);

                // 3. Append the text elements to this central container
                centerSection.appendChild(itemTitle);
                centerSection.appendChild(itemAuthor);

                // 4. Return the assembled section to be used in the main playlist row
                return centerSection;
            }


            /**
            * Creates a container div that groups the right-hand metadata of a playlist item.
            * This function utilizes `generatePlaylistItemLength` and `generatePlaylistItemSize`
            * to populate the section with duration and file size information.
            *
            * @param {string} length - The duration of the audiobook.
            * @param {string} size - The file size of the audiobook.
            * @returns {HTMLDivElement} The container div holding the length and size elements.
            */
            function generatePlaylistItemRightSection(length, size) {
                // 1. Create the wrapper div for the right-side layout
                const rightSection = document.createElement("div");
                rightSection.classList.add("playlist-item-right-section");

                // 2. Generate the individual elements using your previously defined functions
                const itemLength = generatePlaylistItemLength(length);
                const itemSize = generatePlaylistItemSize(size);

                // 3. Append the generated elements into the right-section container
                rightSection.appendChild(itemLength);
                rightSection.appendChild(itemSize);

                // 4. Return the assembled section
                return rightSection;
            }


            /**
            * Creates a paragraph element to display the index or track number 
            * of an audiobook within the playlist UI.
            *
            * @param {string|number} number - The position of the item in the list.
            * @returns {HTMLParagraphElement} The formatted paragraph element.
            */
            function generatePlaylistItemNumber(number) {
                // 1. Create a new <p> element to hold the track number
                const itemNumber = document.createElement("p");

                // 2. Add the specific class for number styling (e.g., greyed out or small font)
                itemNumber.classList.add("playlist-item-number");

                // 3. Set the text content to the provided number
                itemNumber.textContent = number;

                // 4. Return the element to be used in the playlist item row
                return itemNumber;
            }


            /**
            * Creates a span element to display the status icon of an audiobook 
            * (e.g., played, downloading, or current) within the playlist UI.
            *
            * @param {string} status - The status data or icon character/class.
            * @returns {HTMLSpanElement} The formatted span element.
            */
            function generatePlaylistItemStatus(status) {
                // 1. Create a <span> element (ideal for inline icons or short status markers)
                const itemStatus = document.createElement("span");

                // 2. Add the class for status-specific styling or icon font integration
                itemStatus.classList.add("playlist-item-status");

                // 3. Set the text content, which will represent the icon
                itemStatus.textContent = status;

                // 4. Return the span to be included in the playlist item
                return itemStatus;
            }


            /**
            * Creates a paragraph element to display the title of the audiobook 
            * within the playlist UI.
            *
            * @param {string} title - The title of the audiobook.
            * @returns {HTMLParagraphElement} The formatted paragraph element.
            */
            function generatePlaylistItemTitle(title) {
                // 1. Create a new <p> element to serve as the title container
                const itemTitle = document.createElement("p");

                // 2. Add the specific class for title styling (usually bold or larger font)
                itemTitle.classList.add("playlist-item-title");

                // 3. Set the text content to the audiobook's title
                itemTitle.textContent = title;

                // 4. Return the element to be used in the playlist assembly
                return itemTitle;
            }


            /**
            * Creates a paragraph element to display the author's name 
            * within the audiobook playlist UI.
            *
            * @param {string} author - The name of the audiobook author.
            * @returns {HTMLParagraphElement} The formatted paragraph element.
            */
            function generatePlaylistItemAuthor(author) {
                // 1. Create a new <p> element to hold the author's name
                const itemAuthor = document.createElement("p");

                // 2. Apply the CSS class dedicated to author styling
                itemAuthor.classList.add("playlist-item-author");

                // 3. Inject the author's name into the element
                itemAuthor.textContent = author;

                // 4. Return the element so it can be added to the playlist item container
                return itemAuthor;
            }


            /**
             * Converts a duration in seconds into a human-readable format (HH:MM:SS or MM:SS)
             * and returns a styled paragraph element.
             *
             * @param {number} lengthInSeconds - The total duration of the audiobook in seconds.
             * @returns {HTMLParagraphElement} The formatted paragraph element.
             */
            function generatePlaylistItemLength(lengthInSeconds) {
                // 1. Convert input to a number and handle potential undefined values
                const totalSeconds = parseInt(lengthInSeconds, 10) || 0;

                // 2. Calculate hours, minutes, and remaining seconds
                const hours = Math.floor(totalSeconds / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;

                // 3. Format components to always have two digits (e.g., "05" instead of "5")
                const pad = (num) => String(num).padStart(2, "0");

                // 4. Determine the display format: only show hours if they exist
                let finalDisplayString = "";
                if (hours > 0) {
                    // Format as H:MM:SS or HH:MM:SS
                    finalDisplayString = `${hours}:${pad(minutes)}:${pad(seconds)}`;
                } else {
                    // Format as M:SS or MM:SS
                    finalDisplayString = `${minutes}:${pad(seconds)}`;
                }

                // 5. Create a new <p> element to hold the duration text
                const itemLength = document.createElement("p");

                // 6. Add the specific class for duration styling
                itemLength.classList.add("playlist-item-length");

                // 7. Populate the element with the formatted time string
                itemLength.textContent = finalDisplayString;

                // 8. Return the element for placement in the DOM
                return itemLength;
            }


            /**
             * Converts a size in KB to the most readable format (KB, MB, or GB) 
             * and returns a styled paragraph element.
             *
             * @param {number} sizeKb - The size of the file in Kilobytes.
             * @returns {HTMLParagraphElement} The formatted paragraph element.
             */
            function generatePlaylistItemSize(sizeKb) {
                // 1. Define the units and the scaling factor (1024 is standard for digital storage)
                const units = ['KB', 'MB', 'GB'];
                let size = parseFloat(sizeKb);
                let unitIndex = 0;

                // 2. Loop to scale the number down while it's large enough to fit the next unit
                while (size >= 1024 && unitIndex < units.length - 1) {
                    size /= 1024;
                    unitIndex++;
                }

                // 3. Format the number: 0 decimals for KB, 2 decimals for MB/GB for precision
                const formattedSize = unitIndex === 0 ? size : size.toFixed(2);
                const finalDisplayString = `${formattedSize} ${units[unitIndex]}`;

                // 4. Create a new <p> element in the document memory
                const itemSize = document.createElement("p");

                // 5. Assign the CSS class for specific styling
                itemSize.classList.add("playlist-item-size");

                // 6. Set the text content to the newly calculated and formatted string
                itemSize.textContent = finalDisplayString;

                // 7. Return the completed element so it can be appended to the DOM
                return itemSize;
            }
        </script>
